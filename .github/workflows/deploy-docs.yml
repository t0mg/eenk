name: Deploy Documentation Site

# Fast workflow to build and deploy the documentation site to GitHub Pages.
# Runs automatically on pushes to main that modify docs or web tools, or manually.
# Does NOT compile firmware binaries.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tools/flasher/**'
      - 'tools/device-manager/**'
      - 'WritingForEenk.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Build Site & Deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build documentation site
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build.js

      - name: Preserve latest release manifest.json and firmware binaries
        run: |
          mkdir -p docs/dist/firmware
          curl -sL "https://t0mg.github.io/eenk/manifest.json" -o docs/dist/manifest.json || true
          curl -sL "https://t0mg.github.io/eenk/firmware/x3x4-firmware-factory.bin" -o docs/dist/firmware/x3x4-firmware-factory.bin || true
          curl -sL "https://t0mg.github.io/eenk/firmware/x3x4-firmware.bin" -o docs/dist/firmware/x3x4-firmware.bin || true
          curl -sL "https://t0mg.github.io/eenk/firmware/x4pro-firmware-factory.bin" -o docs/dist/firmware/x4pro-firmware-factory.bin || true
          curl -sL "https://t0mg.github.io/eenk/firmware/x4pro-firmware.bin" -o docs/dist/firmware/x4pro-firmware.bin || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
