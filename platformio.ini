; EENK - Interactive Fiction Runtime for Xteink X4
; PlatformIO Project Configuration
;
; Two environments:
;   esp32c3 - Target hardware (ESP32-C3, 16MB flash, Arduino framework)
;   native  - Desktop simulation (host compiler, SDL2 window for M1+)

[platformio]
default_envs = native

; --- Shared build settings ---
[common]
build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14
build_flags =
    -std=gnu++17
    -Wall
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE

; --- ESP32-C3 Target (Xteink X4 hardware) ---
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.embed_txtfiles = data/the_intercept.bin
extra_scripts = post:merge_firmware.py
lib_ldf_mode = deep+
lib_deps = 
    FS
    LittleFS
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DPLATFORM_ESP32
    -DINKCPP_NO_STD
    -DINKCPP_NO_RTTI
    -DINKCPP_NO_EXCEPTIONS
    -Os
build_src_filter =
    +<*>
    -<hal/sdl/>
monitor_speed = 115200

; --- ESP32-C3 Serial Debug (dev boards, no e-ink hardware) ---
; Renders the game to the USB serial terminal using VT100 escape codes.
; Use this environment to iterate on gameplay without needing the Xteink X4.
[env:esp32c3_serial]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.embed_txtfiles = data/the_intercept.bin
extra_scripts = post:merge_firmware.py
lib_ldf_mode = deep+
lib_deps =
    FS
    LittleFS
lib_ignore = EInkDisplay
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DPLATFORM_ESP32
    -DSERIAL_DEBUG
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DINKCPP_NO_STD
    -DINKCPP_NO_RTTI
    -DINKCPP_NO_EXCEPTIONS
    -Os
build_src_filter =
    +<*>
    -<hal/sdl/>
monitor_speed = 115200

; --- Native Desktop (SDL2 simulation, M1+) ---
[env:native]
platform = native
extra_scripts = pre:link_flags.py
build_flags =
    ${common.build_flags}
    -DPLATFORM_NATIVE
    -g
    -O0
    -IC:/msys64/mingw64/include/SDL2
    -Isrc/hal/sdl/mock
    -DSDL_MAIN_HANDLED
lib_ignore = EInkDisplay
build_src_filter =
    +<*>
    -<hal/esp32/>
lib_ldf_mode = deep+



