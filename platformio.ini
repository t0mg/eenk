; eenk - Interactive Fiction Runtime for Xteink X4 and X4 Pro
; PlatformIO Project Configuration
;
; Environments:
;   native          - Desktop simulation (host compiler, SDL2 window)
;   esp32c3         - Xteink X3/X4 target hardware (symmetric A/B OTA, CrossPoint layout)
;   esp32s3         - Xteink X4 Pro target hardware (symmetric A/B OTA)

[platformio]
default_envs = native

; --- Shared build settings ---
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14
; Inject EENK_VERSION_STR from Git tag before every compilation.
; On a clean tag build (e.g. v0.1.0), git describe returns "v0.1.0" with no suffix.
; On local dev builds it appends the short SHA and/or "-dirty".
extra_scripts = pre:scripts/build_version.py
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE

; --- ESP32-C3 Target (Xteink X3&X4 hardware) ---
[x4]
extends = common
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
lib_ldf_mode = deep+
monitor_speed = 115200
lib_deps =
    FS
    BoardConfig=symlink://lib/freeink-sdk/libs/hardware/BoardConfig
    InputManager=symlink://lib/freeink-sdk/libs/hardware/InputManager
    PowerManager=symlink://lib/freeink-sdk/libs/hardware/PowerManager
build_flags =
    ${common.build_flags}
    -DFREEINK_DEVICE_X4=1
    -DFREEINK_DEVICE_X3=1
    -DPLATFORM_ESP32
    -DHAS_SD_CARD
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc/hal/esp32/x4
    -Isrc/hal/esp32/common
    -DFREEINK_BOOK_SMALL=1
    -Os

[env:esp32c3]
extends = x4
extra_scripts = 
    ${common.extra_scripts}
    post:merge_firmware.py
lib_deps = 
    ${x4.lib_deps}
    EInkDisplay=symlink://lib/freeink-sdk/libs/display/FreeInkDisplay
    BatteryMonitor=symlink://lib/freeink-sdk/libs/hardware/BatteryMonitor
    XteinkDetect=symlink://lib/freeink-sdk/libs/hardware/XteinkDetect
    FreeInkBook=symlink://lib/freeink-sdk/libs/book/FreeInkBook
build_flags =
    ${x4.build_flags}
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DINKCPP_NO_STD
    -DINKCPP_NO_RTTI
    -DINKCPP_NO_EXCEPTIONS
    -DENABLE_SERIAL_LOG
    -DLOG_LEVEL=1
    -Isrc/fwupdate/compat
    -Wl,--wrap=bootloader_common_check_efuse_blk_validity
build_src_filter =
    +<*>
    -<hal/sdl/>
    -<hal/esp32/x4pro/>

; --- ESP32-S3 Target (Xteink X4 Pro hardware) ---
[x4pro]
extends = common
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
monitor_speed = 115200
lib_deps =
    FS
    SD_MMC
    BoardConfig=symlink://lib/freeink-sdk/libs/hardware/BoardConfig
    InputManager=symlink://lib/freeink-sdk/libs/hardware/InputManager
    PowerManager=symlink://lib/freeink-sdk/libs/hardware/PowerManager
build_flags =
    ${common.build_flags}
    -DFREEINK_DEVICE_X4PRO=1
    -DPLATFORM_ESP32
    -DBOARD_HAS_PSRAM
    -DHAS_SD_CARD
    -DUSE_SD_MMC
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc/hal/esp32/x4pro
    -Isrc/hal/esp32/common
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
    -Os

[env:esp32s3]
extends = x4pro
extra_scripts = 
    ${common.extra_scripts}
    post:merge_firmware.py
lib_deps =
    ${x4pro.lib_deps}
    EInkDisplay=symlink://lib/freeink-sdk/libs/display/FreeInkDisplay
    BatteryMonitor=symlink://lib/freeink-sdk/libs/hardware/BatteryMonitor
    XteinkDetect=symlink://lib/freeink-sdk/libs/hardware/XteinkDetect
    FrontLightManager=symlink://lib/freeink-sdk/libs/hardware/FrontlightManager
    FreeInkBook=symlink://lib/freeink-sdk/libs/book/FreeInkBook
build_flags =
    ${x4pro.build_flags}
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DINKCPP_NO_STD
    -DINKCPP_NO_RTTI
    -DINKCPP_NO_EXCEPTIONS
    -DENABLE_SERIAL_LOG
    -DLOG_LEVEL=1
    -Isrc/fwupdate/compat
build_src_filter =
    +<*>
    -<hal/sdl/>
    -<hal/esp32/x4/>
    -<fwupdate/skip_efuse_blk_check.c>

; Both esp32c3 and esp32s3 share the symmetric CrossPoint A/B partition table
; (partitions.csv: dual 6.25 MiB OTA slots + 3.375 MiB spiffs) and perform
; in-app SD firmware updates via src/fwupdate/.

; --- Native Desktop (SDL2 simulation) ---
[env:native]
platform = native
extra_scripts = 
    ${common.extra_scripts}
    pre:link_flags.py
build_flags =
    ${common.build_flags}
    -DPLATFORM_NATIVE
    -DFREEINK_BOOK_LARGE=1
    -g
    -O0
    -Isrc/hal/sdl/mock
lib_deps =
    FreeInkBook=symlink://lib/freeink-sdk/libs/book/FreeInkBook
lib_ignore = EInkDisplay
build_src_filter =
    +<*>
    -<hal/esp32/>
    -<fwupdate/>
lib_ldf_mode = deep+
test_build_src = true
