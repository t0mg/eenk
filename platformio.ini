; eenk - Interactive Fiction Runtime for Xteink X4 and X4 Pro
; PlatformIO Project Configuration
;
; Environments:
;   native          - Desktop simulation (host compiler, SDL2 window)
;   esp32c3         - Xteink X4 target hardware (app0 main firmware)
;   esp32c3_updater - Xteink X4 target hardware (app1 OTA updater firmware)
;   esp32s3         - Xteink X4 Pro target hardware (app0 main firmware)
;   esp32s3_updater - Xteink X4 Pro target hardware (app1 OTA updater firmware)

[platformio]
default_envs = native

; --- Shared build settings ---
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE

; --- ESP32-C3 Target (Xteink X4 hardware) ---
[x4]
platform = ${common.platform}
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
monitor_speed = 115200

[env:esp32c3]
extends = x4
extra_scripts = post:merge_firmware.py
lib_deps =
    FS
    BoardConfig=symlink://lib/freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://lib/freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://lib/freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://lib/freeink-sdk/libs/hardware/BatteryMonitor
    PowerManager=symlink://lib/freeink-sdk/libs/hardware/PowerManager
build_flags =
    ${common.build_flags}
    -DFREEINK_DEVICE_X4=1
    -DPLATFORM_ESP32
    -DHAS_SD_CARD
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DINKCPP_NO_STD
    -DINKCPP_NO_RTTI
    -DINKCPP_NO_EXCEPTIONS
    -Isrc/hal/esp32/x4
    -Isrc/hal/esp32/common
    -Os
build_src_filter =
    +<*>
    -<hal/sdl/>
    -<hal/esp32/x4pro/>
    -<updater/>

; --- ESP32-C3 Updater (app1 OTA Firmware) ---
[env:esp32c3_updater]
extends = x4
board_upload.offset_address = 0x710000
extra_scripts = post:scripts/upload_app1.py
lib_deps =
    FS
    BoardConfig=symlink://lib/freeink-sdk/libs/hardware/BoardConfig
    InputManager=symlink://lib/freeink-sdk/libs/hardware/InputManager
    PowerManager=symlink://lib/freeink-sdk/libs/hardware/PowerManager
build_flags =
    ${common.build_flags}
    -DFREEINK_DEVICE_X4=1
    -DPLATFORM_ESP32
    -DHAS_SD_CARD
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=8192
    -Isrc/hal/esp32/x4
    -Isrc/hal/esp32/common
    -Os
build_src_filter =
    +<updater/>
    +<hal/esp32/x4/>
    +<hal/esp32/common/>
    +<os/>
    -<os/BootManager.cpp>
    -<main.cpp>

; --- ESP32-S3 Target (Xteink X4 Pro hardware) ---
[x4pro]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions_x4pro.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 8323072
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
monitor_speed = 115200

[env:esp32s3]
extends = x4pro
extra_scripts = post:merge_firmware.py
lib_deps =
    FS
    SD_MMC
    BoardConfig=symlink://lib/freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://lib/freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://lib/freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://lib/freeink-sdk/libs/hardware/BatteryMonitor
build_flags =
    ${common.build_flags}
    -DFREEINK_DEVICE_X4PRO=1
    -DPLATFORM_ESP32
    -DBOARD_HAS_PSRAM
    -DHAS_SD_CARD
    -DUSE_SD_MMC
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DINKCPP_NO_STD
    -DINKCPP_NO_RTTI
    -DINKCPP_NO_EXCEPTIONS
    -Isrc/hal/esp32/x4pro
    -Isrc/hal/esp32/common
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
    -Os
build_src_filter =
    +<*>
    -<hal/sdl/>
    -<hal/esp32/x4/>
    -<updater/>

; --- ESP32-S3 Updater (app1 OTA Firmware) ---
[env:esp32s3_updater]
extends = x4pro
board_upload.offset_address = 0x800000
extra_scripts = post:scripts/upload_app1.py
lib_deps =
    FS
    SD_MMC
    BoardConfig=symlink://lib/freeink-sdk/libs/hardware/BoardConfig
    InputManager=symlink://lib/freeink-sdk/libs/hardware/InputManager
build_flags =
    ${common.build_flags}
    -DFREEINK_DEVICE_X4PRO=1
    -DPLATFORM_ESP32
    -DHAS_SD_CARD
    -DUSE_SD_MMC
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=8192
    -Isrc/hal/esp32/x4pro
    -Isrc/hal/esp32/common
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
    -Os
build_src_filter =
    +<updater/>
    +<hal/esp32/x4pro/>
    +<hal/esp32/common/>
    +<os/>
    -<os/BootManager.cpp>
    -<main.cpp>

; --- Native Desktop (SDL2 simulation) ---
[env:native]
platform = native
extra_scripts = pre:link_flags.py
build_flags =
    ${common.build_flags}
    -DPLATFORM_NATIVE
    -g
    -O0
    -IC:/msys64/mingw64/include/SDL2
    -Isrc/hal/sdl/mock
    -DSDL_MAIN_HANDLED
lib_ignore = EInkDisplay
build_src_filter =
    +<*>
    -<hal/esp32/>
    -<updater/>
lib_ldf_mode = deep+
test_build_src = true
