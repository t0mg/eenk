; eenk - Interactive Fiction Runtime for Xteink X4 and X4 Pro
; PlatformIO Project Configuration
;
; Environments:
;   native          - Desktop simulation (host compiler, SDL2 window)
;   esp32c3         - Xteink X3/X4 target hardware (app0 main firmware)
;   esp32c3_updater - Xteink X4 target hardware (app1 OTA updater firmware)
;   esp32s3         - Xteink X4 Pro target hardware (app0 main firmware)
;   (no esp32s3_updater: X4 Pro uses symmetric A/B OTA, no separate updater needed)

[platformio]
default_envs = native

; --- Shared build settings ---
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14
; Inject EENK_VERSION_STR from Git tag before every compilation.
; On a clean tag build (e.g. v0.1.0), git describe returns "v0.1.0" with no suffix.
; On local dev builds it appends the short SHA and/or "-dirty".
extra_scripts = pre:scripts/build_version.py
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE

; --- ESP32-C3 Target (Xteink X3&X4 hardware) ---
[x4]
extends = common
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_ldf_mode = deep+
monitor_speed = 115200
lib_deps =
    FS
    BoardConfig=symlink://lib/freeink-sdk/libs/hardware/BoardConfig
    InputManager=symlink://lib/freeink-sdk/libs/hardware/InputManager
    PowerManager=symlink://lib/freeink-sdk/libs/hardware/PowerManager
build_flags =
    ${common.build_flags}
    -DFREEINK_DEVICE_X4=1
    -DFREEINK_DEVICE_X3=1
    -DPLATFORM_ESP32
    -DHAS_SD_CARD
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc/hal/esp32/x4
    -Isrc/hal/esp32/common
    -Os

[env:esp32c3]
extends = x4
extra_scripts = 
    ${common.extra_scripts}
    post:merge_firmware.py
lib_deps = 
    ${x4.lib_deps}
    EInkDisplay=symlink://lib/freeink-sdk/libs/display/FreeInkDisplay
    BatteryMonitor=symlink://lib/freeink-sdk/libs/hardware/BatteryMonitor
    XteinkDetect=symlink://lib/freeink-sdk/libs/hardware/XteinkDetect
build_flags =
    ${x4.build_flags}
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DINKCPP_NO_STD
    -DINKCPP_NO_RTTI
    -DINKCPP_NO_EXCEPTIONS
build_src_filter =
    +<*>
    -<hal/sdl/>
    -<hal/esp32/x4pro/>
    -<updater/>

; --- ESP32-C3 Updater (app1 OTA Firmware) ---
; Lean SD-card-only recovery. WiFi OTA is not yet implemented — WifiProvisioner
; is excluded from this build to keep the binary well within the 1 MB app1 slot.
[env:esp32c3_updater]
extends = x4
upload_command = "$UPLOADER" --chip esp32c3 --port "$UPLOAD_PORT" --baud $UPLOAD_SPEED --before default-reset --after hard-reset write-flash -z --flash-mode $BOARD_FLASH_MODE --flash-freq 80m --flash-size detect 0x710000 $SOURCE
lib_deps =
    ${x4.lib_deps}
    EInkDisplay=symlink://lib/freeink-sdk/libs/display/FreeInkDisplay
    BatteryMonitor=symlink://lib/freeink-sdk/libs/hardware/BatteryMonitor
    XteinkDetect=symlink://lib/freeink-sdk/libs/hardware/XteinkDetect
build_flags =
    ${x4.build_flags}
    -DARDUINO_LOOP_STACK_SIZE=8192
build_src_filter =
    +<updater/>
    +<hal/esp32/x4/>
    +<hal/esp32/common/>
    +<os/>
    -<os/BootManager.cpp>
    -<updater/WifiProvisioner.cpp>
    -<main.cpp>

; --- ESP32-S3 Target (Xteink X4 Pro hardware) ---
[x4pro]
extends = common
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions_x4pro.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 8323072
lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
monitor_speed = 115200
lib_deps =
    FS
    SD_MMC
    BoardConfig=symlink://lib/freeink-sdk/libs/hardware/BoardConfig
    InputManager=symlink://lib/freeink-sdk/libs/hardware/InputManager
    PowerManager=symlink://lib/freeink-sdk/libs/hardware/PowerManager
build_flags =
    ${common.build_flags}
    -DFREEINK_DEVICE_X4PRO=1
    -DPLATFORM_ESP32
    -DBOARD_HAS_PSRAM
    -DHAS_SD_CARD
    -DUSE_SD_MMC
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc/hal/esp32/x4pro
    -Isrc/hal/esp32/common
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
    -Os

[env:esp32s3]
extends = x4pro
extra_scripts = 
    ${common.extra_scripts}
    post:merge_firmware.py
lib_deps =
    ${x4pro.lib_deps}
    EInkDisplay=symlink://lib/freeink-sdk/libs/display/FreeInkDisplay
    BatteryMonitor=symlink://lib/freeink-sdk/libs/hardware/BatteryMonitor
    XteinkDetect=symlink://lib/freeink-sdk/libs/hardware/XteinkDetect
    FrontLightManager=symlink://lib/freeink-sdk/libs/hardware/FrontlightManager
build_flags =
    ${x4pro.build_flags}
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DINKCPP_NO_STD
    -DINKCPP_NO_RTTI
    -DINKCPP_NO_EXCEPTIONS
build_src_filter =
    +<*>
    -<hal/sdl/>
    -<hal/esp32/x4/>
    -<updater/>

; esp32s3_updater removed: the X4 Pro uses symmetric A/B OTA partitions
; (both app0 and app1 are full-size, ~7.9 MB each). There is no separate
; minimal recovery partition — standard OTA swaps between the two slots.
; Full firmware OTA is handled directly from app0 via WifiProvisioner.
; See: partitions_x4pro.csv

; --- Native Desktop (SDL2 simulation) ---
[env:native]
platform = native
extra_scripts = 
    ${common.extra_scripts}
    pre:link_flags.py
build_flags =
    ${common.build_flags}
    -DPLATFORM_NATIVE
    -g
    -O0
    -Isrc/hal/sdl/mock
    -DSDL_MAIN_HANDLED
lib_ignore = EInkDisplay
build_src_filter =
    +<*>
    -<hal/esp32/>
    -<updater/>
lib_ldf_mode = deep+
test_build_src = true
