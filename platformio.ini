; EENK - Interactive Fiction Runtime for Xteink X4
; PlatformIO Project Configuration
;
; Three environments:
;   esp32c3         - Target hardware (app0 main firmware)
;   esp32c3_updater - Target hardware (app1 OTA updater firmware)
;   native          - Desktop simulation (host compiler, SDL2 window for M1+)

[platformio]
default_envs = native

; --- Shared build settings ---
[common]
build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE

; --- ESP32-C3 Target (Xteink X4 hardware) ---
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
extra_scripts = post:merge_firmware.py
lib_ldf_mode = deep+
lib_deps =
    FS
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DPLATFORM_ESP32
    -DHAS_SD_CARD
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DINKCPP_NO_STD
    -DINKCPP_NO_RTTI
    -DINKCPP_NO_EXCEPTIONS
    -Os
build_src_filter =
    +<*>
    -<hal/sdl/>
    -<updater/>
monitor_speed = 115200

; --- ESP32-C3 Updater (app1 OTA Firmware) ---
[env:esp32c3_updater]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 1048576
board_upload.offset_address = 0x710000
extra_scripts = post:scripts/upload_app1.py
lib_ldf_mode = deep+
lib_deps =
    FS
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DPLATFORM_ESP32
    -DHAS_SD_CARD
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=8192
    -Os
build_src_filter =
    +<updater/>
    +<hal/esp32/>
    +<os/>
    -<os/BootManager.cpp>
    -<main.cpp>
monitor_speed = 115200

; --- Native Desktop (SDL2 simulation, M1+) ---
[env:native]
platform = native
extra_scripts = pre:link_flags.py
build_flags =
    ${common.build_flags}
    -DPLATFORM_NATIVE
    -g
    -O0
    -IC:/msys64/mingw64/include/SDL2
    -Isrc/hal/sdl/mock
    -DSDL_MAIN_HANDLED
lib_ignore = EInkDisplay
build_src_filter =
    +<*>
    -<hal/esp32/>
    -<updater/>
lib_ldf_mode = deep+
test_build_src = true



